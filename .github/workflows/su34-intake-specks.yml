name: Su34 intake corner and lip Windows packages
on:
  push:
    branches: [fix/su34-intake-specks-20261117]
    paths: [.github/workflows/su34-intake-specks.yml]
permissions:
  contents: write
env:
  PYTHONUTF8: "1"
  TASK_BRANCH: fix/su34-intake-specks-20261117
  GH_TOKEN: ${{ github.token }}
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            aircraft/su34/src/intake-front
            aircraft/su34/src/intake-specks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.3.5 Pillow
      - name: Reproduce fitted model; verify full ZIPs, original data and PE32/PE32+
        run: python aircraft/su34/src/intake-specks/package.py
