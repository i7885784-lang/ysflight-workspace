name: Su34 equal recessed intake ends
on:
  push:
    branches: [fix/su34-intake-recess-20261117]
    paths: [.github/workflows/su34-intake-recess.yml]
permissions:
  contents: write
env:
  PYTHONUTF8: "1"
  TASK_BRANCH: fix/su34-intake-recess-20261117
  GH_TOKEN: ${{ github.token }}
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            aircraft/su34/src/intake-front
            aircraft/su34/src/intake-recess
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.3.5 shapely==2.1.2 Pillow
      - name: Repackage approved private games without native launch tests
        run: python aircraft/su34/src/intake-recess/package.py
