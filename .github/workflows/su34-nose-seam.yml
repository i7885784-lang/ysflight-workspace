name: Su34 nose-door seam private candidate
on:
  push:
    branches: [fix/su34-nose-bay-seam-20261116]
    paths: [.github/workflows/su34-nose-seam.yml]
  workflow_dispatch:
permissions:
  contents: write
env:
  TASK_BRANCH: fix/su34-nose-bay-seam-20261116
  GH_TOKEN: ${{ github.token }}
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      matrix:
        bits: [32,64]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: aircraft/su34/src/nose-seam
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy Pillow
      - name: Real native gear cycle without public model artifacts
        run: python aircraft/su34/src/nose-seam/native.py ${{ matrix.bits }}
  package:
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: aircraft/su34/src/nose-seam
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy Pillow
      - name: Keep model and full games only in authenticated draft; check anonymous404
        run: python aircraft/su34/src/nose-seam/package.py

