name: Su34 full current Windows builds
on:
  push:
    branches: [build/su34-current-20261117]
    paths: [.github/workflows/su34-current.yml]
permissions:
  contents: write
env:
  PYTHONUTF8: "1"
  TASK_BRANCH: build/su34-current-20261117
  GH_TOKEN: ${{ github.token }}
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            aircraft/su34/src/intake-front
            aircraft/su34/src/intake-current
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 shapely==2.1.2 Pillow
      - name: Build exact current model; verify full ZIPs, PE architectures and unchanged game files
        run: python aircraft/su34/src/intake-current/package.py
