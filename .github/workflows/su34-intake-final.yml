name: Su34 final intake lip fix
on:
  push:
    branches: [fix/su34-intake-final-20261117]
    paths: [.github/workflows/su34-intake-final.yml]
permissions:
  contents: write
env:
  PYTHONUTF8: "1"
  TASK_BRANCH: fix/su34-intake-final-20261117
  GH_TOKEN: ${{ github.token }}
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            aircraft/su34/src/intake-front
            aircraft/su34/src/intake-final
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 shapely==2.1.2 Pillow
      - name: Package unchanged true x86 and x64 executables without repeat launch tests
        run: python aircraft/su34/src/intake-final/package.py
